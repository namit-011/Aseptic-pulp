name: Deploy to Hostinger

on:
  push:
    branches: [main]
    # This repo holds multiple unrelated projects (pulp-marketplace, a stale
    # root-level duplicate of this same site, etc.) - only redeploy when the
    # actual site folder changes, not on every unrelated commit to the repo.
    paths: ["aseptic-pulp/**"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PULP_FTP_SERVER }}
          username: ${{ secrets.PULP_FTP_USERNAME }}
          password: ${{ secrets.PULP_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./aseptic-pulp/
          server-dir: ./
          # This FTP account is already scoped directly to the Pulp docroot
          # (confirmed by hand: logging in lands right at index.html/app.js),
          # unlike the main site's account which needed a nested server-dir.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/package.json
            **/package-lock.json
            **/yt-dlp.exe
          # First run uploads everything; every run after only uploads what
          # actually changed, so routine content-only pushes stay fast.
          state-name: .ftp-deploy-sync-state.json
